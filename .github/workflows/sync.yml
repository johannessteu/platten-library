name: Sync Discogs

on:
  schedule:
    - cron: '23 4 * * *' # daily, 04:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - id: sync
        run: npm run sync
        env:
          DISCOGS_USERNAME: ${{ vars.DISCOGS_USERNAME || 'stolle87' }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}

      - run: npm run check

      - id: commit
        env:
          MESSAGE: ${{ steps.sync.outputs.message }}
        run: |
          if [ -z "$(git status --porcelain -- data public/covers)" ]; then
            echo "Nothing new on Discogs."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data public/covers
          git commit -m "${MESSAGE:-Sync records from Discogs}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
