name: Weekly update

# Once a week: sync the Discogs collection (new records, removed records,
# refreshed details and covers), write liner notes for records that have
# none yet, commit everything to main and deploy.

on:
  schedule:
    - cron: '23 4 * * 5' # Fridays, 04:23 UTC, so new records are up before the weekend
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
    env:
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - id: sync
        name: Sync records and covers from Discogs
        run: npm run sync -- --refresh
        env:
          DISCOGS_USERNAME: ${{ vars.DISCOGS_USERNAME || 'stolle87' }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}

      - id: todo
        name: Count records without liner notes
        run: |
          count=$(npm run -s notes:todo -- --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).length))')
          echo "Records without notes: $count"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" != "0" ] && [ "$HAS_CLAUDE_TOKEN" != "true" ]; then
            echo "::notice::$count records have no liner notes. Add the CLAUDE_CODE_OAUTH_TOKEN secret to write them automatically."
          fi

      - name: Write liner notes with Claude Code
        if: steps.todo.outputs.count != '0' && env.HAS_CLAUDE_TOKEN == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: '/liner-notes alle fehlenden'
          claude_args: |
            --max-turns 200
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(npm run check),Bash(npm run notes:todo *),Bash(npm run -s notes:todo *)"

      - name: Check data (drop new notes that fail)
        run: |
          if ! npm run check; then
            echo "::warning::Some new liner notes failed the check and were dropped; records are still committed."
            git checkout -- data/notes 2>/dev/null || true
            git clean -fdq -- data/notes
            npm run check
          fi

      - id: commit
        name: Commit to main
        env:
          SYNC_MESSAGE: ${{ steps.sync.outputs.message }}
        run: |
          if [ -z "$(git status --porcelain -- data public/covers)" ]; then
            echo "Nothing new this week."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          notes=$(git status --porcelain -- data/notes | grep -c '^??' || true)
          message="${SYNC_MESSAGE:-Refresh records from Discogs}"
          if [ "$notes" -gt 0 ]; then message="$message; add liner notes for $notes records"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data public/covers
          git commit -m "$message"
          git pull --rebase --quiet origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
