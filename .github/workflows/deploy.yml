name: Deploy

# Builds the site and publishes it on GitHub Pages, then refreshes the copy of
# the shelf in Supabase that Claude chats read (see README). Runs on every
# push to main, by hand, and at the end of the Update workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  supabase:
    name: Copy the shelf to Supabase
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::notice::SUPABASE_ANON_KEY is not set, so the Supabase copy for Claude chats was not refreshed."
            exit 0
          fi
          # GitHub Pages can take a moment; wait until regal.json of this build is live.
          live=""
          for _ in $(seq 1 30); do
            if curl -fsS "https://platten.johannessteu.de/regal.json?t=$(date +%s)" | grep -q "\"commit\":\"$SHA\""; then
              live=1
              break
            fi
            sleep 10
          done
          if [ -z "$live" ]; then
            echo "::error::regal.json of $SHA was not live after five minutes."
            exit 1
          fi
          curl -sS --fail-with-body -X POST "https://iqxfvlhmaeysammntxis.supabase.co/functions/v1/platten-sync" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
